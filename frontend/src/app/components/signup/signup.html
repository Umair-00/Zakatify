<div class="auth-page">
  <div class="auth-left">
    <div class="auth-left-content">
      <a routerLink="/" class="auth-back" aria-label="Back to home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        Home
      </a>
      <div class="auth-left-text">
        <h2 class="auth-left-title">Start your zakat journey</h2>
        <p class="auth-left-desc">
          Create an account to calculate, track, and fulfill your obligation with confidence year after year.
        </p>
      </div>
      <div class="auth-left-decoration" aria-hidden="true">
        <div class="decoration-ring"></div>
        <div class="decoration-ring decoration-ring--sm"></div>
      </div>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-logo-mark" aria-hidden="true"></span>
        <h1 class="auth-logo">Zakatify</h1>
        <p class="auth-tagline">Create your free account</p>
      </div>

      <div class="auth-alert auth-alert--error" *ngIf="errorMessage">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="10" /><path d="M15 9l-6 6M9 9l6 6" />
        </svg>
        {{ errorMessage }}
      </div>

      <div class="auth-alert auth-alert--success" *ngIf="successMessage">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M22 11.08V12a10 10 0 11-5.93-9.14" /><path d="M22 4L12 14.01l-3-3" />
        </svg>
        {{ successMessage }}
      </div>

      <form (ngSubmit)="onSubmit($event)">
        <div class="field">
          <label for="email" class="field-label">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            placeholder="you@example.com"
            [disabled]="isLoading"
            autocomplete="email"
          />
        </div>

        <div class="field">
          <label for="password" class="field-label">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="At least 6 characters"
            [disabled]="isLoading"
            autocomplete="new-password"
          />
        </div>

        <div class="field">
          <label for="confirmPassword" class="field-label">Confirm password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="Re-enter your password"
            [disabled]="isLoading"
            autocomplete="new-password"
          />
        </div>

        <button type="submit" class="auth-submit" [disabled]="isLoading">
          {{ isLoading ? 'Creating account...' : 'Create account' }}
          <svg *ngIf="!isLoading" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </button>

        <div class="auth-footer-links">
          <span class="auth-footer-text">Already have an account?</span>
          <a routerLink="/login" class="auth-link">Log in</a>
        </div>
      </form>
    </div>
  </div>
</div>
