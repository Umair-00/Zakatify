<div class="auth-page">
  <div class="auth-left">
    <div class="auth-left-content">
      <a routerLink="/login" class="auth-back" aria-label="Back to login">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        Back to login
      </a>
      <div class="auth-left-text">
        <h2 class="auth-left-title">Almost there</h2>
        <p class="auth-left-desc">
          Choose a strong new password and you'll be back to managing your zakat in no time.
        </p>
      </div>
      <div class="auth-left-decoration" aria-hidden="true">
        <div class="decoration-ring"></div>
        <div class="decoration-ring decoration-ring--sm"></div>
      </div>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-logo-mark" aria-hidden="true"></span>
        <h1 class="auth-logo">Zakatify</h1>
        <p class="auth-tagline">Set a new password</p>
      </div>

      <!-- Token error state -->
      <div *ngIf="tokenError" class="auth-alert auth-alert--error">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="10" /><path d="M15 9l-6 6M9 9l6 6" />
        </svg>
        Invalid or expired reset link. Please request a new one.
      </div>

      <div *ngIf="tokenError" class="auth-footer-links" style="border-top: none; margin-top: 0;">
        <a routerLink="/forgot-password" class="auth-link">Request new reset link</a>
      </div>

      <!-- Normal form state -->
      <div class="auth-alert auth-alert--error" *ngIf="errorMessage && !tokenError">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="10" /><path d="M15 9l-6 6M9 9l6 6" />
        </svg>
        {{ errorMessage }}
      </div>

      <div class="auth-alert auth-alert--success" *ngIf="successMessage">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M22 11.08V12a10 10 0 11-5.93-9.14" /><path d="M22 4L12 14.01l-3-3" />
        </svg>
        {{ successMessage }} Redirecting to login...
      </div>

      <form (ngSubmit)="onSubmit($event)" *ngIf="!tokenError && !successMessage">
        <div class="field">
          <label for="newPassword" class="field-label">New password</label>
          <input
            type="password"
            id="newPassword"
            name="newPassword"
            [(ngModel)]="newPassword"
            placeholder="At least 6 characters"
            [disabled]="isLoading"
            autocomplete="new-password"
          />
        </div>

        <div class="field">
          <label for="confirmPassword" class="field-label">Confirm new password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="Re-enter your new password"
            [disabled]="isLoading"
            autocomplete="new-password"
          />
        </div>

        <button type="submit" class="auth-submit" [disabled]="isLoading">
          {{ isLoading ? 'Updating...' : 'Update password' }}
          <svg *ngIf="!isLoading" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </button>
      </form>
    </div>
  </div>
</div>
