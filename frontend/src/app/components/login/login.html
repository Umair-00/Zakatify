<div class="auth-page">
  <div class="auth-left">
    <div class="auth-left-content">
      <a routerLink="/" class="auth-back" aria-label="Back to home">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        Home
      </a>
      <div class="auth-left-text">
        <h2 class="auth-left-title">Welcome back</h2>
        <p class="auth-left-desc">
          Pick up where you left off and fulfill your obligation with clarity.
        </p>
      </div>
      <div class="auth-left-decoration" aria-hidden="true">
        <div class="decoration-ring"></div>
        <div class="decoration-ring decoration-ring--sm"></div>
      </div>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-logo-mark" aria-hidden="true"></span>
        <h1 class="auth-logo">Zakatify</h1>
        <p class="auth-tagline">Log in to your account</p>
      </div>

      <div class="auth-alert auth-alert--info" *ngIf="infoMessage">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" />
        </svg>
        {{ infoMessage }}
      </div>

      <div class="auth-alert auth-alert--error" *ngIf="errorMessage">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="10" /><path d="M15 9l-6 6M9 9l6 6" />
        </svg>
        {{ errorMessage }}
      </div>

      <form (ngSubmit)="onSubmit($event)">
        <div class="field">
          <label for="email" class="field-label">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            placeholder="you@example.com"
            [disabled]="isLoading"
            autocomplete="email"
          />
        </div>

        <div class="field">
          <label for="password" class="field-label">Password</label>
          <div class="field-password">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              name="password"
              [(ngModel)]="password"
              placeholder="Enter your password"
              [disabled]="isLoading"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="password-toggle"
              (click)="showPassword = !showPassword"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >
              <svg *ngIf="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" />
              </svg>
              <svg *ngIf="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24" /><line x1="1" y1="1" x2="23" y2="23" />
              </svg>
            </button>
          </div>
        </div>

        <div class="forgot-password-row">
          <a routerLink="/forgot-password" class="forgot-password-link">Forgot your password?</a>
        </div>

        <button type="submit" class="auth-submit" [disabled]="isLoading">
          {{ isLoading ? 'Logging in...' : 'Log in' }}
          <svg *ngIf="!isLoading" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </button>

        <div class="auth-footer-links">
          <span class="auth-footer-text">Don't have an account?</span>
          <a routerLink="/signup" class="auth-link">Create one</a>
        </div>
      </form>
    </div>
  </div>
</div>
